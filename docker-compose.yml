#version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: msp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-ml_serving_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-ml_serving_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: msp_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - VOS_DEVICE=${VOS_DEVICE:-cpu}
      - VOS_MAX_FRAMES=${VOS_MAX_FRAMES:-300}
      - MODEL_CACHE_MAX_ITEMS=${MODEL_CACHE_MAX_ITEMS:-4}
    # 2 GB shared memory: PyTorch / NumPy workers crash with "Bus error" on the 64 MB default
    shm_size: "2gb"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      - ./weights:/app/weights:ro            # SAM 2 checkpoints (make weights)
      - model_artifacts:/app/model_artifacts

  prometheus:
    image: prom/prometheus:latest
    container_name: msp_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: msp_grafana
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - prometheus

volumes:
  postgres_data:
  model_artifacts:
  prometheus_data:
  grafana_data:
